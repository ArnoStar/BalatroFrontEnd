# Balatro in the browser, everything together:
#
#   portal    the front door (BalatroPortal): the portal at /, and nginx passes
#             /play/ to web, /api/ to api and /identity/ to identity
#   web       the game (this repository) at /play/
#   api       the game API (BalatroWebAPI, with BalatroEngine), with its
#             PostgreSQL (api-db): the runs and their statistics
#   identity  accounts and sign-in (BalatroIndentityService), with its
#             PostgreSQL (identity-db) and Redis (identity-redis)
#   reports   bug reports from the game (BalatroBugReportService), with its
#             PostgreSQL (reports-db); the portal passes /reports/ to it
#   notification  sends the emails (BalatroNotificationService): the identity
#             service publishes its confirmation codes to rabbitmq
#   rabbitmq  the message broker between them (management UI at http://localhost:15672)
#
# and, only when its profile is asked for (docker compose --profile mail up, or
# COMPOSE_PROFILES=mail in .env):
#   mailpit   catches the emails; read them at http://localhost:8025. Use it with
#             EMAIL_BACKEND=smtp SMTP_HOST=mailpit SMTP_PORT=1025 SMTP_SECURITY=none
#
# The game engine (BalatroEngine) is a library inside the api image, not a service.
#
# Lives in BalatroFrontEnd, next to ../BalatroPortal, ../BalatroWebAPI,
# ../BalatroIndentityService, ../BalatroNotificationService and ../balatro_src
# (a copy of the game):
#
#   docker compose up --build        # then open http://localhost:8087
#
# The game's build reads the game's own files (textures, sounds, shaders, data,
# font) from ../balatro_src; they go into the image, not into any repository.
#
# Settings (environment, or a .env file next to this one, which deployments keep):
#   WEB_PORT                     the site's port (8087)
#   PUBLIC_URL                   the site's public origin, as players type it
#                                (http://localhost:8087): the tokens' issuer is
#                                <PUBLIC_URL>/identity, Google's redirect <PUBLIC_URL>/auth/callback
#   API_URL                      the API's public base URL if it isn't this site's /api/
#   API_PORT, IDENTITY_PORT      the API's and identity service's ports on this machine (8000, 8001)
#   BALATRO_API_DEBUG_COMMANDS   1 to allow the API's test helpers (off)
#   BALATRO_API_AUTH_JWKS_URL    empty to run the API without sign-in (everyone is one player)
#   IDENTITY_DB_PASSWORD         the identity database's password (set it on a server)
#   API_DB_PASSWORD              the API database's password (set it on a server)
#   ADMINS                       account ids (the identity service's, comma-separated) of
#                                the developers: they read the bug reports and may
#                                rebuild runs from them in the API
#   REPORTS_DB_PASSWORD          the reports database's password (set it on a server)
#   REPORTS_PORT, REPORTS_DB_PORT  the report service's and its database's ports on this
#                                machine (8003, 55434), for it run outside Docker
#   API_DB_PORT                  the API database's port on this machine (55433), for
#                                the API run outside Docker (its `make db`, `make run`)
#   EMAIL_BACKEND, EMAIL_FROM, SMTP_*   how the notification service sends the emails
#                                (console by default: they are in `docker compose logs notification`)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   Google sign-in (off when unset)
#   IDENTITY_DB_PORT, IDENTITY_REDIS_PORT    the identity database's and Redis's ports on
#                                this machine (55432, 56379), for the identity
#                                service run outside Docker (its `make run`)
#   RABBITMQ_PASSWORD            RabbitMQ's password (set it on a server)
#   NOTIFICATION_PORT, MAILPIT_PORT, MAILPIT_SMTP_PORT, RABBITMQ_PORT, RABBITMQ_UI_PORT
#                                their ports on this machine (8002, 8025, 1025, 5672,
#                                15672), for the services run outside Docker
name: balatro

services:
  portal:
    build:
      context: ../BalatroPortal
      network: host # downloads through this machine's connection (VPNs, see api)
    environment:
      GAME_UPSTREAM: http://web:80
      API_UPSTREAM: http://api:8000
      IDENTITY_UPSTREAM: http://identity:8000
      # (not a dependency: the site runs without the report service, /reports/ answers 502)
      REPORTS_UPSTREAM: http://reports:8000
    ports:
      - "${WEB_PORT:-8087}:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      identity:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      additional_contexts:
        game: ../balatro_src
      network: host # as for the API (apt, npm)
      args:
        # the browser calls the API there (by default, /api on the page's own origin)
        VITE_API_URL: ${API_URL:-}
    environment:
      # where the game container's own /api/ goes (when it is opened without the portal)
      API_UPSTREAM: ${API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../BalatroWebAPI
      # downloads (apt, uv, the engine from GitHub) go through this machine's own
      # connection: Docker's bridge (MTU 1500) stalls behind a VPN tunnel with a
      # smaller MTU (WireGuard: 1420)
      network: host
    environment:
      BALATRO_API_DATABASE_URL: postgresql://balatro:${API_DB_PASSWORD:-balatro}@api-db:5432/balatro
      BALATRO_API_ADMINS: ${ADMINS:-}
      BALATRO_API_DEBUG_COMMANDS: ${BALATRO_API_DEBUG_COMMANDS:-0}
      # sign-in: the identity service's keys, and who signs the tokens (its PUBLIC_URL)
      BALATRO_API_AUTH_JWKS_URL: ${BALATRO_API_AUTH_JWKS_URL-http://identity:8000/.well-known/jwks.json}
      BALATRO_API_AUTH_ISSUER: ${PUBLIC_URL:-http://localhost:8087}/identity
      BALATRO_API_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8087}
    volumes:
      # the SQLite file the API used before PostgreSQL (/data/balatro.db): copy
      # its runs once with `docker compose exec api python -m balatro_api.manage
      # import-sqlite /data/balatro.db`
      - runs:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      api-db:
        condition: service_healthy
    restart: unless-stopped

  api-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: balatro
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:-balatro}
      POSTGRES_DB: balatro
    volumes:
      - api-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${API_DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balatro -d balatro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  reports:
    build:
      context: ../BalatroBugReportService
      network: host
    environment:
      BALATRO_REPORTS_DATABASE_URL: postgresql://reports:${REPORTS_DB_PASSWORD:-reports}@reports-db:5432/reports
      BALATRO_REPORTS_ADMINS: ${ADMINS:-}
      BALATRO_REPORTS_AUTH_JWKS_URL: ${BALATRO_API_AUTH_JWKS_URL-http://identity:8000/.well-known/jwks.json}
      BALATRO_REPORTS_AUTH_ISSUER: ${PUBLIC_URL:-http://localhost:8087}/identity
      BALATRO_REPORTS_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8087}
    ports:
      - "127.0.0.1:${REPORTS_PORT:-8003}:8000"
    depends_on:
      reports-db:
        condition: service_healthy
    restart: unless-stopped

  reports-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: ${REPORTS_DB_PASSWORD:-reports}
      POSTGRES_DB: reports
    volumes:
      - reports-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${REPORTS_DB_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports -d reports"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  identity:
    build:
      context: ../BalatroIndentityService
      network: host
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8087}/identity
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8087}
      OAUTH_REDIRECT_URIS: ${PUBLIC_URL:-http://localhost:8087}/auth/callback
      DATABASE_URL: postgresql+asyncpg://identity:${IDENTITY_DB_PASSWORD:-identity}@identity-db:5432/identity
      REDIS_URL: redis://identity-redis:6379/0
      # the codes go to the notification service, which writes and sends the emails
      EMAIL_BACKEND: notifications
      RABBITMQ_URL: amqp://balatro:${RABBITMQ_PASSWORD:-balatro}@rabbitmq:5672/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - identity-data:/data # the JWT signing key
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8001}:8000"
    depends_on:
      identity-db:
        condition: service_healthy
      identity-redis:
        condition: service_healthy
      # (healthy = consuming: its queues exist, so the codes are routed)
      notification:
        condition: service_healthy
    restart: unless-stopped

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
      POSTGRES_DB: identity
    volumes:
      - identity-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${IDENTITY_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  identity-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # sessions survive a restart
    volumes:
      - identity-redis:/data
    ports:
      - "127.0.0.1:${IDENTITY_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notification:
    build:
      context: ../BalatroNotificationService
      network: host
    environment:
      RABBITMQ_URL: amqp://balatro:${RABBITMQ_PASSWORD:-balatro}@rabbitmq:5672/
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Balatro <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # the links in the emails: the site (the portal)
      SITE_URL: ${PUBLIC_URL:-http://localhost:8087}
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8002}:8000" # /health
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025" # the inbox, in a browser
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP, for the notification service run outside Docker
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: balatro
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-balatro}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672" # AMQP, for the services run outside Docker
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      # (only once the broker made its cookie file: a CLI run before it would make
      # the file itself, with the wrong owner, and the broker would stop)
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  runs:
  api-db:
  reports-db:
  identity-data:
  identity-db:
  identity-redis:
  rabbitmq:
